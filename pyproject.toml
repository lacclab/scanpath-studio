[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scanpath-studio"
dynamic = ["version"]
description = "Interactive visualization of eye-tracking data from reading studies: draw, replay and compare scanpaths, fixations, saccades and gaze heatmaps over the text, and export figures and tables."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Omer Shubi", email = "lacclab.technion@gmail.com" },
    { name = "Keren Gruteke Klein" },
    { name = "Maya Grossman" },
    { name = "Ella Lion" },
    { name = "Deborah N. Jakobi" },
    { name = "David R. Reich" },
    { name = "Lena Jäger" },
    { name = "Yevgeni Berzak" },
]
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "eye-tracking", "eye-tracker", "eye-movements", "gaze", "scanpath", "fixations",
    "saccades", "heatmap", "visualization", "reading", "psycholinguistics",
    "cognitive-science", "eyelink", "tobii", "streamlit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "streamlit[performance]>=1.66.0",
    # Build versions sort and compare as PEP 440 (`build_info.py`, `updates.py`).
    "packaging>=26.3",
    "pandas>=3.0",
    "plotly>=7.1",
    "numpy>=2.4",
    # The drift-correction port (`alignment.py`); BSD-3, MIT-compatible.
    "scipy>=1.17",
    "pyarrow>=25.0",
    "kaleido>=1.4",
    # Optional Streamlit runtime dep: enables fast event-based file-watching
    # (hot reload) for `streamlit run`. Not imported by app code — Streamlit
    # auto-detects it and falls back to polling (+ an "install Watchdog" log) if
    # absent.
    "watchdog>=6.0.0",
    # Drag-to-reorder the trial chip fields (the chips popover).
    "streamlit-sortables>=0.3.1",
    # Rasterized animation export (GIF/MP4): Pillow encodes GIF; imageio's ffmpeg
    # extra bundles an ffmpeg binary for MP4 (no system package needed).
    "pillow>=12.3",
    "imageio[ffmpeg]>=2.37",
    # pandas' .xlsx engine. Not optional in practice: the upload path reads
    # spreadsheets (`data._read_one`).
    "openpyxl>=3.1.5",
    # Dataset downloads verify HTTPS against the OS certificate store, so a
    # python.org Python without its CA bundle, or a TLS-inspecting network,
    # can still fetch OneStop / PoTeC (`datasets._open_url`).
    "truststore>=0.10",
    # The Excel 97–2003 (.xls) engine, for the same readers.
    "xlrd>=2.0.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    # Parallelize the AppTest-heavy suite (`pytest -n auto`).
    "pytest-xdist>=3.0.0",
    # Registers the `@pytest.mark.timeout` marker the AppTest tests rely on;
    # required for collection under `--strict-markers`.
    "pytest-timeout>=2.1.0",
]
# The linter, pinned to exactly what CI runs (.github/workflows/ci.yml). An
# unpinned ruff means a local run and CI can disagree — a new release lands new
# rules and reds a branch that changed nothing. Bump both together.
lint = [
    "ruff==0.16.8",
]
# Build the documentation site (MkDocs Material + API autodoc from docstrings).
# Material caps MkDocs below 2.0, which has no plugin system; every plugin here
# except git-revision-date and llmstxt is one Zensical also runs.
docs = [
    # `imaging` is the social-card renderer, switched on in CI only (mkdocs.yml).
    "mkdocs-material[imaging]>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    # Executes the pages' `exec="true"` fences: the gallery, the printed
    # outputs, the generated references.
    "markdown-exec>=1.12.3",
    "mkdocs-redirects>=1.2.3",
    "mkdocs-git-revision-date-localized-plugin>=1.6.0",
    "mkdocs-llmstxt>=0.5.0",
    # mkdocstrings wraps the API reference's signatures with it. Pinned with
    # the `lint` extra's, so the two extras resolve together.
    "ruff==0.16.8",
]

[project.urls]
"Live demo" = "https://scanpath-studio.streamlit.app"
Repository = "https://github.com/lacclab/scanpath-studio"
Documentation = "https://lacclab.github.io/scanpath-studio/"
Issues = "https://github.com/lacclab/scanpath-studio/issues"

[project.scripts]
scanpath-studio = "scanpath_studio.cli:main"

[tool.setuptools.dynamic]
# Single source of truth for the release number: scanpath_studio.__release__
# (`__version__` is the exact build, worked out from it at runtime).
version = { attr = "scanpath_studio.__release__" }

[tool.setuptools]
include-package-data = true
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
# The data folders (assets/, sample_data/, sample_data/images/) have no
# __init__.py, so they are namespace packages setuptools ships only when they
# are listed — hence the `.*` pattern.
include = ["scanpath_studio", "scanpath_studio.*"]

[tool.setuptools.package-data]
"scanpath_studio" = [
    # The header logo. It lives inside the package, not at the repo root,
    # because only this list ships — a logo outside it would leave every
    # pip-installed copy with an empty header.
    "assets/*.png",
    "sample_data/*.csv",
    "sample_data/*.parquet",
    "sample_data/images/*.png",
    "sample_data/images/*.csv",
]

[tool.ruff.lint]
# Ruff's default rule set is what we run, pinned to an exact version (the `lint`
# and `docs` extras above and `.github/workflows/ci.yml`), so a new default
# arrives only with a deliberate bump. There is deliberately no `select`: naming
# whole families would enable far more than the default (`S` alone flags every
# assert in the test suite). What follows is the short list we decline, each
# with its reason.
#
# These three are named explicitly because the codebase carries `# noqa`
# directives for them and ruff 0.16 does not enable them by default; without
# them `--fix` deletes those directives as unused and the code then fails under
# a ruff that does enable the rule. E402 guards `api.py`'s deliberately
# load-bearing import order, E712 four identity-vs-equality assertions that test
# exactly that distinction, and N802 the `do_GET` / `do_PUT` names that
# `BaseHTTPRequestHandler` requires.
extend-select = ["E402", "E712", "N802"]
ignore = [
    # `dict(size=12, color="#fff")` is Plotly's own authoring idiom and how its
    # entire documentation is written; `plots.py` alone has 220 of them nested
    # inside figure specs. Brace literals there are harder to read and diff, and
    # would put this codebase at odds with every Plotly example a contributor
    # will find. This is a style disagreement with the linter, not a defect.
    "C408",
    # Broad `except Exception` is deliberate and documented at each site: a
    # corrupt recovery cache must never stop the app opening (`persistence.py`),
    # and a single malformed corpus must never take down a 31-corpus catalogue.
    # The alternative — enumerating every exception a third-party loader can
    # raise — is the fragile option, not the safe one.
    "BLE001",
    # Would have us raise TypeError where the codebase raises ValueError. The
    # distinction is real but the call sites are user-facing validation where
    # ValueError is what the app catches and renders; changing them is a
    # behaviour change dressed as a lint fix.
    "TRY004",
    # `except: pass` around best-effort cleanup and optional-feature probes,
    # each already carrying a comment saying why the failure is ignorable.
    "S110", "S112",
    # Naive local timestamps are correct here: these stamp a local recovery
    # cache, single-machine by design. Making them
    # tz-aware would imply a portability this data does not have.
    "DTZ005", "DTZ006",
    # Fires on scripts with a shebang that are run via `python <script>`; the
    # shebang documents the interpreter rather than declaring them executable.
    "EXE001",
    # Adjacent strings inside a list/tuple, which is the shape of a missing
    # comma. Every current site is a long message wrapped across lines, each
    # fragment ending mid-sentence with a trailing space; ruff's remedy (more
    # parentheses) makes none of them clearer. Re-check by hand if it ever
    # starts firing somewhere new.
    "ISC004",
    # One site, `animation_export.py`: a NamedTemporaryFile with `delete=False`
    # and an immediate close, which is how you reserve a path for ffmpeg to
    # write into. A `with` block would delete the file before the encoder opened
    # it. Silenced here rather than with a `# noqa`, because SIM115 is enabled by
    # default in some ruff versions and not others — a directive for it reads as
    # "unused" on half of them and gets deleted by `--fix`.
    "SIM115",
]

[tool.ruff.lint.per-file-ignores]
# Test doubles are plain classes with mutable attributes standing in for
# Streamlit objects; annotating each as ClassVar documents nothing about a fake.
# The pytest.raises idioms are the assertion itself, not a useless expression,
# and `v == v` is the standard NaN filter.
#
# SIM401 and RUF019 are the load-bearing pair: both rewrite
# `"k" in x and x["k"]` to `x.get("k")`, which is correct for `st.session_state`
# but WRONG for `AppTest.session_state` — the testing proxy has no `.get` and
# raises `AttributeError: get not found in session_state`. The membership form
# is the only one that works on both, so tests must keep it. They are listed
# together deliberately: silencing only SIM401 leaves RUF019 to make the same
# edit under a different number.
"tests/*" = [
    "RUF012", "B018", "PLR0124", "PLW0177", "PLW1510", "SIM117", "SIM401",
    "RUF019",
]
# One-off scripts, run by hand and read top to bottom: the closures they define
# inside loops are called in the same iteration, and their subprocess calls have
# their return codes inspected directly.
"benchmarks/*" = ["B023", "PLW1510"]
"paper/*" = ["B023"]
"desktop/*" = ["PLW1510"]

[tool.coverage.run]
source = ["scanpath_studio"]
# Two one-shot data-prep scripts, deliberately untested and deliberately not
# counted. Both are run by hand, once per data refresh, against corpora that are
# not in the repo and cannot be in CI: `onestop_shard` needs the ~15 GB OneStop
# lacclab CSVs, `update_sample_data` needs the full OneStop release to
# regenerate the bundled demo. Testing them would mean mocking the file layout
# they exist to walk, which pins the mock rather than the script.
omit = [
    "scanpath_studio/onestop_shard.py",
    "scanpath_studio/update_sample_data.py",
]
# Measure with `sys.monitoring` (PEP 669) rather than `sys.settrace`. Coverage.py
# only makes it the default from Python 3.14, and on the 3.12 the Coverage job
# and the docs deploy run, the settrace core made the suite 2.7x slower than the
# plain test legs: 25 min against 9. Line coverage is identical. Needs
# coverage ≥ 7.9 for the setting. On 3.11, which has no `sys.monitoring`, it
# warns once and falls back to the old core. Branch coverage under sysmon needs
# 3.14, so switching `branch` on means moving the Coverage job to 3.14 too.
core = "sysmon"

[tool.coverage.report]
# A floor, not a target: it fails the build when a change drops coverage
# meaningfully, without turning every PR into a coverage negotiation. Raise it
# when the real number has been comfortably above for a while.
#
# It sits a little below the real number on purpose: a floor exists to catch a
# drop, and one set above the truth keeps the build red and catches nothing. The
# uncovered remainder is mostly Streamlit rendering in `tabs.py` / `app.py` /
# `controls.py`.
fail_under = 88
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
