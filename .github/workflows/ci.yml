name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      # uv resolves + installs the wheel-heavy stack far faster than pip, and
      # its restored cache makes repeat runs near-instant. --system targets the
      # setup-python interpreter for this matrix leg.
      - name: Install package + test deps
        run: uv pip install --system -e ".[test]"

      - name: Run pytest
        # -n auto fans the suite across the runner's cores; the Streamlit
        # AppTest integration tests are CPU-bound app boots and dominate the
        # runtime, so this is a ~3x wall-clock win.
        run: pytest -q -n auto

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install package + test deps
        run: uv pip install --system -e ".[test]"

      # One leg only: the number does not vary by interpreter, and --cov costs
      # tracing overhead on top of the matrix above. The floor lives in
      # pyproject.toml ([tool.coverage.report] fail_under), so this step and a
      # local `pytest --cov` gate on the same value.
      - name: Run pytest with coverage
        run: pytest -q -n auto --cov

      # The number in the PR, without needing a third-party service: the Docs
      # workflow publishes the browsable report + the README badge on push to
      # main (ENG-37).
      - name: Summarize
        if: always()
        run: |
          echo '## Coverage' >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check --exclude other_vis .

      - name: ruff format check
        run: ruff format --check --exclude other_vis .
