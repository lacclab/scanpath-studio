[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scanpath-studio"
dynamic = ["version"]
description = "Interactive Streamlit workbench for visualizing eye-tracking-while-reading scanpaths, computing reading measures, and exporting figures and tabular data."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Omer Shubi", email = "lacclab.technion@gmail.com" },
    { name = "Keren Gruteke Klein" },
    { name = "Maya Grossman" },
    { name = "Ella Lion" },
    { name = "Deborah N. Jakobi" },
    { name = "David R. Reich" },
    { name = "Lena Jäger" },
    { name = "Yevgeni Berzak" },
]
license = { file = "LICENSE" }
keywords = ["eye-tracking", "scanpath", "visualization", "streamlit", "reading", "psycholinguistics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "streamlit>=1.62.0",
    "pandas>=2.3.3",
    "plotly>=6.5.2",
    "numpy>=2.4.1",
    # Effect-size + significance tests for the group-comparison analysis views
    # (AN-21: Welch t-test, Mann–Whitney U). BSD-3, MIT-compatible — see the
    # PRE-0 ADR, which also earmarks scipy for the PRE-3 drift-correction port.
    "scipy>=1.13",
    "pyarrow>=23.0.0",
    "kaleido>=1.2.0",
    # Optional Streamlit runtime dep: enables fast event-based file-watching
    # (hot reload) for `streamlit run`. Not imported by app code — Streamlit
    # auto-detects it and falls back to polling (+ an "install Watchdog" log) if
    # absent (ENG-7).
    "watchdog>=6.0.0",
    # Drag-to-reorder the trial chip fields (the inline "Edit chips" popover).
    "streamlit-sortables>=0.3.1",
    # Rasterized animation export (GIF/MP4): Pillow encodes GIF; imageio's ffmpeg
    # extra bundles an ffmpeg binary for MP4 (no system package needed).
    "pillow>=10.0",
    "imageio[ffmpeg]>=2.34",
    # pandas' .xlsx engine. Not optional in practice: the upload path reads
    # spreadsheets (`data._read_one`) and MultiplEYE's comprehension-questions
    # workbook is a shipped enrichment, so without it an upload raises and the
    # questions column silently never appears (#BUG-41).
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    # Parallelize the AppTest-heavy suite (`pytest -n auto`).
    "pytest-xdist>=3.0.0",
    # Registers the `@pytest.mark.timeout` marker the AppTest tests rely on;
    # required for collection under `--strict-markers`.
    "pytest-timeout>=2.1.0",
]
# Build the documentation site (MkDocs Material + API autodoc from docstrings).
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[project.urls]
Repository = "https://github.com/lacclab/scanpath-studio"
Documentation = "https://lacclab.github.io/scanpath-studio/"
Issues = "https://github.com/lacclab/scanpath-studio/issues"

[project.scripts]
scanpath-studio = "scanpath_studio.cli:main"

[tool.setuptools.dynamic]
# Single source of truth for the version: scanpath_studio/__version__
version = { attr = "scanpath_studio.__version__" }

[tool.setuptools]
include-package-data = true
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["scanpath_studio"]

[tool.setuptools.package-data]
"scanpath_studio" = [
    # UX-62: the header logo. It lives inside the package, not at the repo root,
    # because only this list ships — a logo outside it would leave every
    # pip-installed copy with an empty header.
    "assets/*.png",
    "sample_data/*.csv",
    "sample_data/*.parquet",
    "sample_data/*.feather",
    "sample_data/images/*.png",
    "sample_data/images/*.csv",
]

[tool.ruff]
# Vendored third-party visualisations; not ours to restyle.
extend-exclude = ["other_vis"]

[tool.ruff.lint]
# WHY THIS SECTION EXISTS. The repo had no ruff config at all, so `ruff check`
# ran on whatever that release happened to enable by default. Ruff 0.16 expanded
# that default from a handful of rules to 413, and CI — which installs ruff
# unpinned — went from green to 1,678 errors overnight without a line of our
# code changing. Those rules are adopted rather than reverted; what follows is
# the short list we decline, each with its reason.
#
# Deliberately no `select`: ruff's default set is what we run, and naming whole
# families instead would enable far more than the default (selecting `S` alone
# turns on S101 and flags all 4,734 asserts in the test suite). The residual
# risk is that a future ruff moves the default again — the cheap guard against
# that is pinning ruff's version in `.github/workflows/ci.yml`, which currently
# installs it unpinned.
#
# These three are named explicitly because the codebase carries `# noqa`
# directives for them and 0.16 does NOT enable them by default. Leaving them to
# the default set meant those directives read as "unused", ruff's own `--fix`
# deleted sixteen of them, and the code then failed under any older ruff that
# still enables the rule. Naming them keeps the suppressions live and honest:
# E402 guards `api.py`'s deliberately load-bearing import order, E712 four
# identity-vs-equality assertions that are testing exactly that distinction, and
# N802 the `do_GET` / `do_PUT` names that `BaseHTTPRequestHandler` requires.
extend-select = ["E402", "E712", "N802"]
ignore = [
    # `dict(size=12, color="#fff")` is Plotly's own authoring idiom and how its
    # entire documentation is written; `plots.py` alone has 220 of them nested
    # inside figure specs. Brace literals there are harder to read and diff, and
    # would put this codebase at odds with every Plotly example a contributor
    # will find. This is a style disagreement with the linter, not a defect.
    "C408",
    # Broad `except Exception` is deliberate and documented at each site: a
    # corrupt recovery cache must never stop the app opening (`persistence.py`),
    # and a single malformed corpus must never take down a 31-corpus catalogue.
    # The alternative — enumerating every exception a third-party loader can
    # raise — is the fragile option, not the safe one.
    "BLE001",
    # Would have us raise TypeError where the codebase raises ValueError. The
    # distinction is real but the call sites are user-facing validation where
    # ValueError is what the app catches and renders; changing them is a
    # behaviour change dressed as a lint fix.
    "TRY004",
    # `except: pass` around best-effort cleanup and optional-feature probes,
    # each already carrying a comment saying why the failure is ignorable.
    "S110", "S112",
    # Naive local timestamps are correct here: these stamp a local recovery
    # cache and a local tracker, both single-machine by design. Making them
    # tz-aware would imply a portability this data does not have.
    "DTZ005", "DTZ006",
    # Fires on scripts with a shebang that are run via `python <script>`; the
    # shebang documents the interpreter rather than declaring them executable.
    "EXE001",
    # Adjacent strings inside a list/tuple, which is the shape of a missing
    # comma — so this one was not waved through: all 21 sites were read, and
    # every one is a long message wrapped across lines, each fragment ending
    # mid-sentence with a trailing space. Ruff's remedy is to parenthesize them,
    # which adds a level of brackets to every wrapped message in the tour, the
    # computations page and the API docstrings without making any of them
    # clearer. Worth re-checking by hand if it ever starts firing somewhere new.
    "ISC004",
    # One site, `animation_export.py`: a NamedTemporaryFile with `delete=False`
    # and an immediate close, which is how you reserve a path for ffmpeg to
    # write into. A `with` block would delete the file before the encoder opened
    # it. Silenced here rather than with a `# noqa`, because SIM115 is enabled by
    # default in some ruff versions and not others — a directive for it reads as
    # "unused" on half of them and gets deleted by `--fix`, which is exactly how
    # sixteen other suppressions were lost during this sweep.
    "SIM115",
]

[tool.ruff.lint.per-file-ignores]
# Test doubles are plain classes with mutable attributes standing in for
# Streamlit objects; annotating each as ClassVar documents nothing about a fake.
# The pytest.raises idioms are the assertion itself, not a useless expression,
# and `v == v` is the standard NaN filter.
#
# SIM401 and RUF019 are the load-bearing pair, and they are here because the
# first of them broke five tests before it was caught: both rewrite
# `"k" in x and x["k"]` to `x.get("k")`, which is correct for `st.session_state`
# but WRONG for `AppTest.session_state` — the testing proxy has no `.get` and
# raises `AttributeError: get not found in session_state`. The membership form
# is the only one that works on both, so tests must keep it. They are listed
# together deliberately: silencing only SIM401 leaves RUF019 to make the same
# edit under a different number.
"tests/*" = [
    "RUF012", "B018", "PLR0124", "PLW0177", "PLW1510", "SIM117", "SIM401",
    "RUF019",
]
# One-off scripts, run by hand and read top to bottom: the closures they define
# inside loops are called in the same iteration, and their subprocess calls have
# their return codes inspected directly.
"benchmarks/*" = ["B023", "PLW1510"]
"paper/*" = ["B023"]
"desktop/*" = ["PLW1510"]

[tool.coverage.run]
source = ["scanpath_studio"]
# Two one-shot data-prep scripts, deliberately untested and deliberately not
# counted. Both are run by hand, once per data refresh, against corpora that are
# not in the repo and cannot be in CI: `onestop_shard` needs the ~15 GB OneStop
# lacclab CSVs, `update_sample_data` needs the full OneStop release to
# regenerate the bundled demo. Testing them would mean mocking the file layout
# they exist to walk, which pins the mock rather than the script (ENG-37).
omit = [
    "scanpath_studio/onestop_shard.py",
    "scanpath_studio/update_sample_data.py",
]

[tool.coverage.report]
# A floor, not a target: it fails the build when a change drops coverage
# meaningfully, without turning every PR into a coverage negotiation. Raise it
# when the real number has been comfortably above for a while.
fail_under = 89
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
