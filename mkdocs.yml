site_name: Scanpath Studio
site_description: >-
  Interactive workbench for eye-tracking-while-reading data: draw, replay and
  compare scanpaths over the text, and export figures and tables.
site_url: https://lacclab.github.io/scanpath-studio/
repo_url: https://github.com/lacclab/scanpath-studio
repo_name: lacclab/scanpath-studio
copyright: >-
  MIT licensed · cite it by its DOI,
  <a href="https://doi.org/10.5281/zenodo.22933884">10.5281/zenodo.22933884</a>

theme:
  name: material
  logo: assets/icon.png
  favicon: assets/icon.png
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/file-eye-outline
  palette:
    # Blue brand palette, with the docs surface and type tokens in theme.css.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/extra.css
  - stylesheets/theme.css

extra_javascript:
  - javascripts/figures.js
  - javascripts/video.js
  - javascripts/controls.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lacclab/scanpath-studio
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/scanpath-studio/
    - icon: material/play-circle
      link: https://scanpath-studio.streamlit.app
      name: Live demo

# Task guides and examples lead; technical references remain separate.
nav:
  - Home: index.md
  - Get started: install.md
  - Tutorials:
      - tutorials/index.md
      - Optimize data collection:
          - tutorials/data-collection/index.md
          - Check a session: tutorials/data-collection/check-a-session.md
          - Compare two eye trackers: tutorials/data-collection/compare-eye-trackers.md
          - Audit an experimenter: tutorials/data-collection/audit-an-experimenter.md
      - Filter data:
          - tutorials/data-filtering/index.md
          - Exclude unsuitable trials: tutorials/data-filtering/exclude-unsuitable-trials.md
          - Select participants by a field: tutorials/data-filtering/select-participants.md
          - Find the trials an analysis needs: tutorials/data-filtering/find-trials-for-an-analysis.md
      - Export customized figures:
          - tutorials/exporting-figures/index.md
          - Export one figure: tutorials/exporting-figures/export-one-figure.md
          - Export a replay: tutorials/exporting-figures/export-a-replay.md
          - Export every trial: tutorials/exporting-figures/export-every-trial.md
      - Analyze a corpus:
          - tutorials/corpus-analysis/index.md
          - Analyze one text: tutorials/corpus-analysis/analyze-one-text.md
          - Compare groups or conditions: tutorials/corpus-analysis/compare-groups.md
          - See progression over time: tutorials/corpus-analysis/progression-over-time.md
  - Feature guides:
      - guides/index.md
      - Scanpath visualization:
          - guides/scanpath-visualization/index.md
          - All controls: guides/scanpath-visualization/controls.md
      - Data management: guides/loading-data/index.md
      - Corpus Analysis:
          - guides/corpus-workspace/index.md
      - Export and share: guides/exporting/index.md
      - FAQ: faq.md
  - Plot gallery:
      - gallery.md
      - Scanpath: gallery/scanpath.md
      - Heatmap: gallery/heatmap.md
      - Fixations by line: gallery/text-lines.md
      - Saccade types: gallery/saccade-types.md
      - Reading schematic: gallery/illustration.md
      - Two readers: gallery/comparison.md
      - Raw gaze: gallery/raw-gaze.md
      - Replay: gallery/replay.md
      - Word profile: gallery/word-profile.md
      - Time course: gallery/time-course.md
      - App recordings: gallery/workflows.md
  - Reference:
      - Python API: api.md
      - CLI reference: cli.md
      - For coding agents: agents.md
  - About:
      - Cite: cite.md
      - Privacy: privacy.md

# Fail the strict build on a link to a heading that does not exist, not only on
# one to a missing page (ENG-79).
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# The abbreviation list is appended to every page by pymdownx.snippets; it is
# not a page of its own. The dataset-adapter contract is developer material,
# read on GitHub from CONTRIBUTING.md, and the harmonised benchmark corpora
# need a bundle only the private EyeGenBench pipeline can build (ENG-80).
# MultiplEYE is held back from the beta, in the app as well (DATA-54).
exclude_docs: |
  includes/
  contributing-a-dataset.md
  benchmark-corpora.md
  multipleye.md

hooks:
  - scripts/mkdocs_hooks.py

plugins:
  - search
  # Google Fonts and every other external asset are downloaded at build time
  # and served from the site itself (ENG-79).
  - privacy
  # Link-preview cards. Needs Cairo, so only the deploy renders them
  # (docs.yml sets SOCIAL_CARDS); a local or pull-request build skips them.
  - social:
      enabled: !ENV [SOCIAL_CARDS, false]
      cards_layout_options:
        background_color: "#1f77b4"
        color: "#ffffff"
  # The pages UX-23 retired and ENG-77 deleted: their old URLs keep working.
  - redirects:
      redirect_maps:
        guides/outputs-sharing.md: guides/scanpath-visualization/index.md#under-the-plot
        onestop.md: guides/loading-data/index.md#onestop
        glossary.md: guides/loading-data/index.md#what-your-data-needs
        data-format.md: guides/loading-data/index.md#what-your-data-needs
        bring-your-own-data.md: guides/loading-data/index.md
        corpus-analysis.md: guides/corpus-workspace/index.md
        tutorials/batch-export.md: tutorials/exporting-figures/export-every-trial.md
        tutorials/compare-two-readers.md: guides/scanpath-visualization/controls.md#compare
        tutorials/figure-for-a-paper.md: tutorials/exporting-figures/export-one-figure.md
        tutorials/line-assignment.md: guides/scanpath-visualization/index.md
        tutorials/load-your-own-data.md: guides/loading-data/index.md
        tutorials/run-it-headless.md: guides/scanpath-visualization/index.md#render-in-code
        automation.md: guides/exporting/index.md
        # ENG-80 took these off the site for the beta; old links land on the
        # repository file that now carries the subject.
        architecture.md: https://github.com/lacclab/scanpath-studio/blob/main/AGENTS.md
        security.md: https://github.com/lacclab/scanpath-studio/blob/main/SECURITY.md
        benchmark-corpora.md: guides/loading-data/index.md
        # DATA-54: MultiplEYE is held back from the beta.
        multipleye.md: guides/loading-data/index.md
        rendering.md: guides/scanpath-visualization/index.md
        contributing-a-dataset.md: https://github.com/lacclab/scanpath-studio/blob/main/docs/contributing-a-dataset.md
        # ENG-88 folded these into Getting started and the FAQ.
        desktop.md: install.md#install
        getting-started.md: install.md
        export-troubleshooting.md: faq.md#export-fails
  # Runs the pages' `exec="true"` fences: the gallery, printed example output,
  # and the generated references (scripts/docs_support.py).
  - markdown-exec
  - mkdocstrings:
      handlers:
        python:
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://pandas.pydata.org/docs/objects.inv
            - https://numpy.org/doc/stable/objects.inv
            - https://plotly.com/python-api-reference/objects.inv
          options:
            show_source: false
            show_root_heading: true
            heading_level: 3
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            docstring_style: google
  - llmstxt:
      markdown_description: >-
        Scanpath Studio is an interactive Streamlit workbench, a Python API
        (`import scanpath_studio as sps`) and a CLI (`scanpath-studio`) for
        eye-tracking-while-reading data: it draws fixations, saccades and
        heatmaps over the text at its true on-screen position, shows the
        per-word reading measures your data brings (FFD, FPRT, RPD, TFD, skips,
        regressions), compares participants, and exports figures and tables. The bundled demo is
        a subset of the OneStop Eye Movements corpus.
      full_output: llms-full.txt
      sections:
        Use the app:
          - install.md: Install, launch, and a first plot
          - tutorials/*.md
          - guides/index.md
          - guides/**/*.md
          - faq.md
        Reference:
          - api.md: The Python API reference
          - cli.md: The CLI reference, every flag included
          - agents.md: Headless use by a coding agent or script
          - gallery/*.md
        About:
          - cite.md
          - privacy.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      auto_append:
        - docs/includes/abbreviations.md
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
