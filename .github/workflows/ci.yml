name: CI

# The whole suite runs once per change: on Python 3.12, split over four
# machines, with coverage. That is what a PR waits for. Every supported Python
# (3.11–3.15) runs weekly and on each release tag: a failure on one version
# only is rare, and five runs on every PR would cost more time than they catch.
on:
  pull_request:
    branches: [main]
  # main is tested after every merge as well: two PRs that are green on their
  # own can break it together, and nothing else runs the suite there.
  push:
    branches: [main]
    tags: ["v*"]
  # Weekly, on whatever versions resolve that day. The install is unpinned, so
  # a dependency release can turn main red with no code change; this finds it
  # before the next unrelated PR does.
  schedule:
    - cron: "41 4 * * 1"
  # By hand: every supported Python on any branch, e.g. a release branch
  # before it is tagged (`gh workflow run ci.yml --ref <branch>`).
  workflow_dispatch:

# Least privilege for the default GITHUB_TOKEN: every job here checks out,
# installs and runs pytest/ruff — none of them write anything back. Declared at
# the top so a job added later inherits read-only rather than the repository
# default, which is what `actions/missing-workflow-permissions` flags.
permissions:
  contents: read

# Per event as well as per ref: a merge to main cancels the previous merge's
# run, not the weekly all-versions run that happens to share main's ref.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The suite in four shares (`SCANPATH_TEST_SHARD` in tests/conftest.py), each
  # measuring its own coverage; the Coverage job below adds them up.
  tests:
    name: Tests ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      # uv resolves + installs the wheel-heavy stack far faster than pip, and
      # its restored cache makes repeat runs near-instant. --system targets the
      # setup-python interpreter.
      - name: Install package + test deps
        run: uv pip install --system -e ".[test]"

      - name: Render the bundled sample from the installed wheel
        if: matrix.shard == 1
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/wheel"
          uv venv --python 3.12 "$RUNNER_TEMP/wheel-env"
          uv pip install --python "$RUNNER_TEMP/wheel-env/bin/python" "$RUNNER_TEMP"/wheel/*.whl
          cd "$RUNNER_TEMP"
          wheel-env/bin/scanpath-studio render --sample -o sample.html
          test -s sample.html

      # -n logical fans the share across every vCPU (`auto` counts physical
      # cores: 2 of the runner's 4); the Streamlit AppTest integration tests
      # are CPU-bound app boots and dominate the runtime.
      # One share's coverage is far below the floor, so the floor is checked
      # once the shares are combined; `[tool.coverage.run] core = "sysmon"`
      # keeps measuring cheap on 3.12.
      - name: Run pytest (share ${{ matrix.shard }} of 4)
        env:
          SCANPATH_TEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          COVERAGE_FILE: .coverage.share${{ matrix.shard }}
        run: pytest -q -n logical --cov --cov-report= --cov-fail-under=0

      - name: Keep this share's coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.shard }}
          path: .coverage.share${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # The floor lives in pyproject.toml ([tool.coverage.report] fail_under), so
  # this job and a local `pytest --cov` gate on the same value.
  coverage:
    name: Coverage
    needs: tests
    # Runs, and fails, when a share failed, rather than being skipped: a
    # skipped check counts as passing.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every share passed
        run: test "${{ needs.tests.result }}" = success

      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install coverage
        run: pip install "coverage>=7.9"

      - name: Collect the shares
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Combine
        run: coverage combine

      # The number in the PR, without needing a third-party service: the Docs
      # workflow publishes the browsable report + the README badge with each
      # release. The report exits non-zero below the floor.
      - name: Check the floor
        run: |
          echo '## Coverage' >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  # Every supported Python, weekly and on release tags (or by hand).
  versions:
    name: Test on Python ${{ matrix.python-version }}
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install package + test deps
        run: uv pip install --system -e ".[test]"

      - name: Run pytest
        run: pytest -q -n logical

  windows-export:
    name: Check lab exports and recovery on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv pip install --system -e ".[test]"
      - run: >-
          python -m pytest -q
          tests/test_export_naming.py::test_extract_portable_bundle_preserves_original_ids
          tests/test_persistence.py::test_two_processes_cannot_replace_the_same_annotation_snapshot

  # The app in a real browser (tests/test_browser_smoke.py): it loads, the
  # true-scale figure draws, a rail popover opens. AppTest runs no frontend, so
  # this is the one check that sees the app's CSS and page scripts against the
  # Streamlit release pip resolves today. The test skips without Playwright,
  # which is why the other jobs collect it harmlessly.
  browser:
    name: Browser smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      # Pinned like the other CI tools; bump it deliberately.
      - name: Install package + test deps + Playwright
        run: uv pip install --system -e ".[test]" playwright==1.63.0

      - name: Install Chromium and WebKit
        run: playwright install --with-deps chromium webkit

      - name: Run the browser smoke test and the download page's link checks
        run: pytest -q tests/test_browser_smoke.py tests/test_bundle_download_page.py

      - name: Check keyboard navigation, narrow imports, and offline downloads in WebKit
        env:
          SCANPATH_WEBKIT: "1"
        run: pytest -q tests/test_webkit_download.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # Pinned deliberately: an unpinned linter turns a new ruff release into a
      # red build on a branch that changed nothing. Bump it when you want the
      # new rules — and bump the `lint` extra in pyproject.toml with it, so a
      # local `ruff check` is the same ruff CI runs.
      - name: Install ruff
        run: pip install ruff==0.17.6

      - name: ruff check
        run: ruff check .

      - name: ruff format check
        run: ruff format --check .

  docs:
    # The docs build runs code — the gallery's figures, the printed examples,
    # the CLI and figure-option references are generated from the package at
    # build time — so a change that breaks them has to fail here, not after
    # the merge in docs.yml's deploy.
    name: Docs build
    runs-on: ubuntu-latest
    env:
      DISABLE_MKDOCS_2_WARNING: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          # The revision-date plugin reads each page's history.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install package + docs deps
        run: uv pip install --system -e ".[docs]"

      - name: Build (strict)
        run: mkdocs build --strict
