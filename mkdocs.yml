site_name: Scanpath Studio
site_description: >-
  Interactive workbench for visualizing eye-tracking-while-reading scanpaths,
  computing reading measures, and exporting figures and tabular data.
site_url: https://lacclab.github.io/scanpath-studio/
repo_url: https://github.com/lacclab/scanpath-studio
repo_name: lacclab/scanpath-studio
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/icon.png
  favicon: assets/icon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    # Brand palette (APP_THEME / APP_THEME_DARK in scanpath_studio/constants.py)
    # via the `custom` scheme colors in stylesheets/extra.css.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - content.code.copy
    - content.tabs.link
    - toc.follow
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lacclab/scanpath-studio
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/scanpath-studio/
    - icon: material/play-circle
      link: https://scanpath-studio.streamlit.app
      name: Live demo

nav:
  - Home: index.md
  - Get started: getting-started.md
  - Tutorials:
      - Choose a tutorial: tutorials/index.md
      - Data collection: tutorials/data-collection.md
      - Data filtering: tutorials/data-filtering.md
      - Exporting figures: tutorials/exporting-figures.md
      - Corpus analysis: tutorials/corpus-analysis.md
  - Feature guides:
      - Choose a guide: guides/index.md
      - Scanpath visualization: guides/scanpath-visualization.md
      - Loading public and own data: guides/loading-data.md
      - Corpus workspace: guides/corpus-workspace.md
      - Outputs and sharing: guides/outputs-sharing.md
  - Automation & reference:
      - Overview: automation.md
      - Python API: api.md
      - CLI reference: cli.md
      - Data format: data-format.md
      - Computations & methodology: computations.md
      - Desktop app: desktop.md
      - Export troubleshooting: export-troubleshooting.md
      - FAQ: faq.md
      - Privacy: privacy.md
      - Public corpora:
          - OneStop: onestop.md
          - MultiplEYE: multipleye.md
          - Harmonised benchmark corpora: benchmark-corpora.md
      - Development:
          - Contributing a dataset: contributing-a-dataset.md
          - Architecture: architecture.md
          - For coding agents: agents.md
          - True-to-scale rendering: rendering.md
          - Security audit: security.md

hooks:
  - scripts/mkdocs_hooks.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            heading_level: 3
            separate_signature: true
            show_signature_annotations: true
            docstring_style: google

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
