# The Streamlit Community Cloud demo installs from this file (it finds it
# before any other dependency file). It installs the app alone; the test and
# lint tools are extras — `pip install -e ".[test]"` in a dev environment.
name: scanpath-studio
channels:
  - conda-forge
dependencies:
  - python>=3.11
  - pip
  - pip:
      - -e .
