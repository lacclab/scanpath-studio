name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/scanpath-studio
    permissions:
      id-token: write  # required for trusted publishing
      contents: write  # required to create the GitHub release
    steps:
      - uses: actions/checkout@v6

      # ENG-62: a tag pushed without bumping the version rebuilt the old one,
      # `skip-existing` below let PyPI skip it without a word, and the job went
      # on to cut a GitHub release and post "published" to Slack with a link
      # that 404s. Refuse up front instead.
      - name: Tag matches the package version
        run: |
          VERSION="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' scanpath_studio/__init__.py)"
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match __version__ ${VERSION} — bump scanpath_studio/__init__.py (and CITATION.cff) before tagging."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build==1.5.0 twine==7.0.0

      - name: Build wheel + sdist
        run: python -m build

      - name: Check distributions
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Create GitHub release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          NOTES_FILE="$(mktemp)"
          # GitHub rejects a release body over 125,000 characters, and a
          # release that bundles months of work overruns that (v0.29.0's
          # section was 172,795) — which published to PyPI and then failed
          # here. Over the cap the changelog's headline half is kept and the
          # rest is linked; leave headroom for the install line appended below.
          python scripts/changelog_notes.py "$VERSION" --format markdown \
            --max-chars 120000 \
            --details-url "https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md" \
            > "$NOTES_FILE"
          if [ ! -s "$NOTES_FILE" ]; then
            printf 'Release %s of scanpath-studio.' "$TAG" > "$NOTES_FILE"
          fi
          if printf '%s' "$VERSION" | grep -Eq '(a|b|rc)[0-9]+$'; then
            printf '\n\n---\nInstall/upgrade: `pip install -U --pre scanpath-studio`\n' >> "$NOTES_FILE"
          else
            printf '\n\n---\nInstall/upgrade: `pip install -U scanpath-studio`\n' >> "$NOTES_FILE"
          fi
          # Idempotent: edit notes if the release already exists, else create it.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$NOTES_FILE"
          else
            # A PEP 440 pre-release (0.31.0b1, 1.0.0rc1) must not become
            # "Latest": pip skips it unless --pre, so the release page would
            # advertise a version `pip install -U` never installs.
            PRERELEASE=""
            if printf '%s' "$VERSION" | grep -Eq '(a|b|rc)[0-9]+$'; then
              PRERELEASE="--prerelease"
            fi
            gh release create "$TAG" --verify-tag --title "$TAG" $PRERELEASE --notes-file "$NOTES_FILE"
          fi

      - name: Notify Slack
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set; skipping Slack notification."
            exit 0
          fi
          VERSION="${TAG#v}"
          URL="https://pypi.org/project/scanpath-studio/${VERSION}/"
          # Slack's ceiling is far lower than GitHub's, and a notification is
          # a summary either way — keep the headlines, link the rest.
          NOTES="$(python scripts/changelog_notes.py "$VERSION" \
            --max-chars 3500 \
            --details-url "https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md")"
          HEADER=":rocket: *scanpath-studio ${TAG}* published to PyPI"
          if [ -n "$NOTES" ]; then
            TEXT="$(printf '%s\n%s\n\n*Release notes:*\n%s' "$HEADER" "$URL" "$NOTES")"
          else
            TEXT="$HEADER — $URL"
          fi
          curl -sSf -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            --data "$(jq -n --arg text "$TEXT" '{text: $text}')"
