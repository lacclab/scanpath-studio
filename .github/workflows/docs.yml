name: Docs

# Build and publish the MkDocs site to GitHub Pages on every push to main.
# Enable Pages once in repo Settings → Pages → Build and deployment → "Deploy
# from a branch" → branch `gh-pages` / root (mkdocs gh-deploy pushes there).
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - scanpath_studio/**
      - tests/**
      - pyproject.toml
      # ENG-94: what the build reads besides docs/ — the generated references,
      # the hooks, and the Changelog / Cite pages (with their Unreleased
      # fragments). A change to only these used to leave the site stale.
      - scripts/docs_support.py
      - scripts/mkdocs_hooks.py
      - scripts/changelog_fragments.py
      - CHANGELOG.md
      - changelog.d/**
      - CITATION.cff
      - .github/workflows/docs.yml
  workflow_dispatch:

# Two rapid pushes to main run gh-deploy concurrently and the force-pushes to
# gh-pages collide (seen on the v0.25.0 release: the #97 merge and the release
# commit raced, first run failed). Queue instead — last run still wins.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      # Link-preview cards (the Material social plugin, ENG-79) — rendered for
      # the published site only.
      SOCIAL_CARDS: "true"
      # Material and a plugin both print a banner about MkDocs 2.0; the site
      # stays on MkDocs 1.x (Material caps it), so the notice is noise here.
      DISABLE_MKDOCS_2_WARNING: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Cairo (social cards)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2
      - name: Install (package + docs + test extras)
        # The test extras are here for the coverage report published alongside
        # the site (ENG-37) — see "Coverage report" below.
        run: pip install -e ".[docs,test]"
      - name: Build (strict — fail on warnings / bad refs)
        id: build
        run: mkdocs build --strict

      # ENG-37 — the coverage badge, with no third-party account and no
      # commit-back. The site is already published from this workflow, so the
      # HTML report is written into the built `site/` and shipped with it, plus a
      # tiny shields.io *endpoint* JSON the README badge reads. That makes the
      # badge a link to the browsable report rather than a bare number.
      # The deploy below publishes `site/` as built, so these extra files ship
      # with it.
      #
      # ENG-62: the report is a by-product of this job, not its gate. It used to
      # run the whole suite *before* deploying with the coverage floor enforced,
      # so one flaky AppTest (ENG-50) or a coverage dip silently stopped the
      # docs from publishing — 10 of 12 pushes to main, the v0.30.0 release
      # included. The PR's CI already gates on both; here the floor is off and a
      # failing run still ships the site (with whatever report it produced).
      - name: Coverage report
        continue-on-error: true
        run: pytest -q -n auto --cov --cov-fail-under=0 --cov-report=html:site/coverage --cov-report=json
      - name: Coverage badge
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          report = pathlib.Path("coverage.json")
          if not report.is_file():
              raise SystemExit(0)  # no report this run: keep the last badge
          total = json.load(report.open())["totals"]["percent_covered"]
          colour = (
              "brightgreen" if total >= 90
              else "green" if total >= 80
              else "yellow" if total >= 70
              else "orange" if total >= 60
              else "red"
          )
          pathlib.Path("site/coverage/badge.json").write_text(
              json.dumps(
                  {
                      "schemaVersion": 1,
                      "label": "coverage",
                      "message": f"{total:.0f}%",
                      "color": colour,
                  }
              )
          )
          PY

      # Publish the `site/` built above, as it is. `mkdocs gh-deploy --dirty`
      # rebuilt it first, and a dirty build skips every page older than its
      # output — all of them, a minute after the strict build — so the llmstxt
      # plugin saw no page and shipped llms.txt / llms-full.txt as bare headings.
      # ghp-import is what gh-deploy itself pushes with (a MkDocs dependency).
      # ENG-94: only a build that passed. `always()` (there so a failed coverage
      # run or badge still ships the site) also force-pushed the partial `site/`
      # a failed strict build leaves behind.
      - name: Deploy to GitHub Pages
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ghp-import --no-jekyll --push --force --message "Deploy docs from ${GITHUB_SHA}" site
