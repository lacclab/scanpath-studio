site_name: Scanpath Studio
site_description: >-
  Free, open-source software for visualizing eye-tracking data from reading
  studies: scanpaths, fixations, saccades, gaze heatmaps and raw gaze drawn over
  the text, from EyeLink, Tobii and other eye trackers.
site_url: https://lacclab.github.io/scanpath-studio/
repo_url: https://github.com/lacclab/scanpath-studio
repo_name: lacclab/scanpath-studio
copyright: >-
  MIT licensed · cite it by its DOI,
  <a href="https://doi.org/10.5281/zenodo.22933884">10.5281/zenodo.22933884</a>

theme:
  name: material
  # Search-engine metadata: the home page's schema.org record and the
  # Search Console tag (`extra` below).
  custom_dir: overrides
  logo: assets/icon.png
  favicon: assets/icon.png
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/file-eye-outline
  palette:
    # Blue brand palette, with the docs surface and type tokens in theme.css.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/extra.css
  - stylesheets/theme.css

extra_javascript:
  - javascripts/figures.js
  - javascripts/video.js
  - javascripts/controls.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lacclab/scanpath-studio
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/scanpath-studio/
    - icon: material/play-circle
      link: https://scanpath-studio.streamlit.app
      name: Live demo
  # Google Search Console's HTML-tag verification for the URL-prefix property
  # https://lacclab.github.io/scanpath-studio/ — paste the `content` value of
  # the tag it offers. Empty writes no tag.
  google_site_verification: FEUvYyUUeFoiAVgouYHaGdMKyTgLGUFLUe99oofr_DY
  # schema.org record written into the home page's head (overrides/main.html),
  # so a search engine knows what the site is about.
  structured_data:
    "@context": https://schema.org
    "@type": SoftwareApplication
    name: Scanpath Studio
    description: >-
      Free, open-source software for visualizing eye-tracking-while-reading
      data: scanpaths, fixations, saccades, gaze heatmaps and raw gaze over the
      text at its on-screen position, participant comparison, reading measures
      and figure export. Runs as a desktop app, in the browser, or from Python
      and the command line.
    url: https://lacclab.github.io/scanpath-studio/
    downloadUrl: https://lacclab.github.io/scanpath-studio/install/
    applicationCategory: Scientific visualization
    operatingSystem: Windows, macOS, Linux
    isAccessibleForFree: true
    offers:
      "@type": Offer
      price: "0"
      priceCurrency: USD
    license: https://opensource.org/licenses/MIT
    identifier: https://doi.org/10.5281/zenodo.22933884
    image: https://lacclab.github.io/scanpath-studio/assets/icon.png
    screenshot: https://lacclab.github.io/scanpath-studio/assets/screenshots/scanpath-view.webp
    keywords: >-
      eye tracking, eye tracker, eye movements, gaze, scanpath, fixations,
      saccades, heatmap, reading, psycholinguistics, EyeLink, Tobii,
      visualization
    author:
      "@type": Organization
      name: Language, Computation and Cognition (LaCC) Lab, Technion
      url: https://lacclab.github.io/
    sameAs:
      - https://github.com/lacclab/scanpath-studio
      - https://pypi.org/project/scanpath-studio/
      - https://scanpath-studio.streamlit.app
      - https://doi.org/10.5281/zenodo.22933884

# Task guides and examples lead; technical references remain separate.
nav:
  - Home: index.md
  - Get started: install.md
  - Tutorials:
      - tutorials/index.md
      - Optimize data collection:
          - tutorials/data-collection/index.md
          - Check a session: tutorials/data-collection/check-a-session.md
          - Compare two eye trackers: tutorials/data-collection/compare-eye-trackers.md
          - Audit an experimenter: tutorials/data-collection/audit-an-experimenter.md
      - Filter data:
          - tutorials/data-filtering/index.md
          - Exclude unsuitable trials: tutorials/data-filtering/exclude-unsuitable-trials.md
          - Select participants by a field: tutorials/data-filtering/select-participants.md
          - Find the trials an analysis needs: tutorials/data-filtering/find-trials-for-an-analysis.md
      - Export customized figures:
          - tutorials/exporting-figures/index.md
          - Export one figure: tutorials/exporting-figures/export-one-figure.md
          - Export a replay: tutorials/exporting-figures/export-a-replay.md
          - Export every trial: tutorials/exporting-figures/export-every-trial.md
      - Analyze a corpus:
          - tutorials/corpus-analysis/index.md
          - Analyze one text: tutorials/corpus-analysis/analyze-one-text.md
          - Compare groups or conditions: tutorials/corpus-analysis/compare-groups.md
          - See progression over time: tutorials/corpus-analysis/progression-over-time.md
  - Feature guides:
      - guides/index.md
      - Scanpath visualization:
          - guides/scanpath-visualization/index.md
          - All controls: guides/scanpath-visualization/controls.md
      - Data management: guides/loading-data/index.md
      - Corpus Analysis:
          - guides/corpus-workspace/index.md
      - Export and share: guides/exporting/index.md
      - FAQ: faq.md
  - Plot gallery:
      - gallery.md
      - Hearts & arrows: gallery/hearts-arrows.md
      - Scanpath: gallery/scanpath.md
      - Gaze heatmap: gallery/heatmap.md
      - Word-box heatmap: gallery/word-boxes.md
      - Fixations by line: gallery/text-lines.md
      - Saccade types: gallery/saccade-types.md
      - Reading schematic: gallery/illustration.md
      - Two readers: gallery/comparison.md
      - Raw gaze: gallery/raw-gaze.md
      - Replay: gallery/replay.md
      - Highlighted text: gallery/highlighted-text.md
      - Across the experiment: gallery/across-experiment.md
  - Reference:
      - Python API: api.md
      - Figure options: figure-options.md
      - CLI reference: cli.md
  - About:
      - about.md
      - Cite: cite.md
      - Privacy: privacy.md

# Fail the strict build on a link to a heading that does not exist, not only on
# one to a missing page.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# The abbreviation list is appended to every page by pymdownx.snippets; it is
# not a page of its own. The dataset-adapter contract is developer material,
# read on GitHub from CONTRIBUTING.md. The harmonised benchmark corpora are
# off by default in the app, so their page stays off the site.
exclude_docs: |
  includes/
  contributing-a-dataset.md
  benchmark-corpora.md

hooks:
  - scripts/mkdocs_hooks.py

plugins:
  - search
  # Google Fonts and every other external asset are downloaded at build time
  # and served from the site itself.
  - privacy
  # Link-preview cards. Needs Cairo, so only the deploy renders them
  # (docs.yml sets SOCIAL_CARDS); a local or pull-request build skips them.
  - social:
      enabled: !ENV [SOCIAL_CARDS, false]
      cards_layout_options:
        background_color: "#1f77b4"
        color: "#ffffff"
  # Pages that were moved, merged or removed: their old URLs keep working.
  - redirects:
      redirect_maps:
        guides/outputs-sharing.md: guides/scanpath-visualization/index.md#under-the-plot
        onestop.md: guides/loading-data/index.md#onestop
        glossary.md: guides/loading-data/index.md#what-your-data-needs
        data-format.md: guides/loading-data/index.md#what-your-data-needs
        bring-your-own-data.md: guides/loading-data/index.md
        corpus-analysis.md: guides/corpus-workspace/index.md
        tutorials/batch-export.md: tutorials/exporting-figures/export-every-trial.md
        tutorials/compare-two-readers.md: guides/scanpath-visualization/controls.md#compare
        tutorials/figure-for-a-paper.md: tutorials/exporting-figures/export-one-figure.md
        tutorials/line-assignment.md: guides/scanpath-visualization/index.md
        tutorials/load-your-own-data.md: guides/loading-data/index.md
        tutorials/run-it-headless.md: guides/scanpath-visualization/index.md#render-in-code
        automation.md: guides/exporting/index.md
        agents.md: api.md
        gallery/workflows.md: index.md#from-recording-to-publication
        gallery/word-profile.md: gallery/across-experiment.md
        gallery/time-course.md: gallery.md
        # Pages that left the site: old links land on the repository file that
        # now carries the subject, or on the nearest guide.
        architecture.md: https://github.com/lacclab/scanpath-studio/blob/main/AGENTS.md
        security.md: https://github.com/lacclab/scanpath-studio/blob/main/SECURITY.md
        benchmark-corpora.md: guides/loading-data/index.md
        multipleye.md: guides/loading-data/index.md
        rendering.md: guides/scanpath-visualization/index.md
        contributing-a-dataset.md: https://github.com/lacclab/scanpath-studio/blob/main/docs/contributing-a-dataset.md
        # Folded into Getting started and the FAQ.
        desktop.md: install.md#install
        getting-started.md: install.md
        export-troubleshooting.md: faq.md#export-fails
  # Runs the pages' `exec="true"` fences: the gallery, printed example output,
  # and the generated references (scripts/docs_support.py).
  - markdown-exec
  - mkdocstrings:
      handlers:
        python:
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://pandas.pydata.org/docs/objects.inv
            - https://numpy.org/doc/stable/objects.inv
            - https://plotly.com/python-api-reference/objects.inv
          options:
            show_source: false
            show_root_heading: true
            # `load_scanpath_data`, not `scanpath_studio.api.load_scanpath_data`:
            # every function is imported from the package root.
            show_root_full_path: false
            heading_level: 3
            # The signature lists names and defaults, wrapped by ruff at this
            # width; the types are in the parameter list under it.
            separate_signature: true
            line_length: 72
            show_signature_annotations: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            docstring_style: google
            docstring_section_style: list
            merge_init_into_class: true
            members_order: source
  - llmstxt:
      markdown_description: >-
        Scanpath Studio is an interactive Streamlit workbench, a Python API
        (`import scanpath_studio as sps`) and a CLI (`scanpath-studio`) for
        eye-tracking-while-reading data: it draws fixations, saccades and
        heatmaps over the text at its true on-screen position, shows the
        per-word reading measures your data brings (FFD, FPRT, RPD, TFD, skips,
        regressions), compares participants, and exports figures and tables. The bundled demo is
        a subset of the OneStop Eye Movements corpus.
      full_output: llms-full.txt
      sections:
        Use the app:
          - install.md: Install, launch, and a first plot
          - tutorials/*.md
          - guides/index.md
          - guides/**/*.md
          - faq.md
        Reference:
          - api.md: The Python API reference
          - figure-options.md: Every figure option, its default and its CLI flag
          - cli.md: The CLI reference, every flag included
          - gallery/*.md
        About:
          - about.md
          - cite.md
          - privacy.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      auto_append:
        - docs/includes/abbreviations.md
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
