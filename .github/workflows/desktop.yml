# ENG-15: standalone desktop builds (PyInstaller onedir — see
# plans/eng-15-desktop-app.md). ENG-21 added the signed, notarized macOS .app +
# .dmg (plans/eng-21-signing-notarization.md). Runs on release tags + manual
# dispatch, not per-PR: a 3-OS build is release infrastructure, not a PR gate.
name: Desktop builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Worst case is roughly 75 minutes: two notarization submissions each
    # allowed `--wait --timeout 30m`, plus the build and two smoke runs. 120
    # leaves headroom without letting a genuinely hung job burn a runner.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: ScanpathStudio-linux-x86_64.tar.gz
          # macos-latest is Apple silicon; there is no Intel build (documented
          # in docs/getting-started.md — add a macos-13 leg if users need one).
          - os: macos-latest
            archive: ScanpathStudio-macos-arm64.dmg
          - os: windows-latest
            archive: ScanpathStudio-windows-x86_64.zip

    env:
      APP: dist/ScanpathStudio.app

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # A regular (non-editable) install: PyInstaller's collect_* helpers need
      # a real installed package tree, not an editable finder.
      - name: Install package + PyInstaller
        run: pip install . pyinstaller==6.22.2

      # ENG-21. Everything below degrades to an unsigned build when the Apple
      # secrets are absent — a fork running workflow_dispatch has none, and must
      # still produce a working bundle. The check is a step output rather than
      # `if: secrets.X != ''`, because secrets are not available in step `if:`.
      - name: Check for Apple signing secrets
        id: signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        # All seven or none. Testing only the certificate would let a half-set
        # configuration reach `notarytool` and fail there with an auth error
        # that says nothing about the missing secret — and a partial set is a
        # setup mistake, not a deliberate unsigned build, so it must be loud.
        run: |
          set -euo pipefail
          missing=""
          for name in APPLE_CERT_P12_BASE64 APPLE_CERT_PASSWORD APPLE_SIGNING_IDENTITY \
                      KEYCHAIN_PASSWORD APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID \
                      APPLE_API_ISSUER_ID; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -z "$missing" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$(echo $missing | wc -w)" -eq 7 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Apple signing secrets — building an unsigned macOS bundle. Users will hit Gatekeeper. See desktop/SIGNING.md."
          else
            echo "::error::Apple signing is partially configured; missing:$missing. Set all seven (desktop/SIGNING.md) or none."
            exit 1
          fi

      - name: Import Developer ID certificate
        if: runner.os == 'macOS' && steps.signing.outputs.enabled == 'true'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/devid.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"

          echo -n "$APPLE_CERT_P12_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Without -lut the keychain relocks after 300s and codesign fails
          # partway through signing ~1700 nested binaries.
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERT_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security

          # The 10.12.5+ ACL gate: without it codesign either prompts for a
          # password (impossible headless) or dies with errSecInternalComponent.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null

          # PREPEND to the search list: `-s <one>` replaces it, which would drop
          # the login keychain for the rest of the job.
          EXISTING=$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING

          # Fail here, not three steps later. `find-identity` exits 0 even when
          # it finds nothing ("0 valid identities found"), so the exit code is
          # not the check — the output is.
          IDENTITIES=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")
          echo "$IDENTITIES"
          echo "$IDENTITIES" | grep -q "Developer ID Application:" || {
            echo "::error::no Developer ID Application identity in the imported keychain — check APPLE_CERT_P12_BASE64 and APPLE_CERT_PASSWORD"
            exit 1
          }
          rm -f "$CERT_PATH"

      # PyInstaller signs every collected binary inside-out when given an
      # identity, with --timestamp, --options=runtime and --entitlements, and
      # then signs the bundle itself. That is the only correct moment: it
      # rewrites Mach-O load paths, which invalidates anything signed earlier.
      # Empty identity (every non-macOS leg, and unsigned macOS) = ad-hoc.
      - name: Build the bundle
        env:
          SCANPATH_CODESIGN_IDENTITY: ${{ steps.signing.outputs.enabled == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
        run: pyinstaller --clean --noconfirm desktop/scanpath_studio.spec

      - name: Verify the macOS signature is notarization-grade
        if: runner.os == 'macOS' && steps.signing.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "$APP"
          DETAILS=$(codesign -dv --verbose=4 "$APP" 2>&1)
          echo "$DETAILS"
          # The three things the notary service rejects builds for, asserted
          # before we spend a submission finding out.
          echo "$DETAILS" | grep -q "flags=.*runtime" \
            || { echo "::error::hardened runtime is not enabled"; exit 1; }
          echo "$DETAILS" | grep -q "^Authority=Developer ID Application:" \
            || { echo "::error::not signed with a Developer ID Application certificate"; exit 1; }
          echo "$DETAILS" | grep -q "^Timestamp=" \
            || { echo "::error::signature has no secure timestamp"; exit 1; }

      # Early, so a broken bundle fails before we spend ~5 minutes notarizing it.
      - name: Smoke test (selfcheck + server boot)
        run: python desktop/smoke_test.py

      - name: Notarize and staple the .app
        if: runner.os == 'macOS' && steps.signing.outputs.enabled == 'true'
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          echo -n "$APPLE_API_KEY_P8_BASE64" \
            | base64 --decode -o "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          # ditto, not zip: zip drops the symlinks and xattrs inside a bundle and
          # the notary service then reports an invalid signature. The zip is only
          # a transport for the submission — the ticket is stapled to the .app.
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          ./.github/scripts/notarize.sh "$RUNNER_TEMP/notarize.zip"
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

      # Built from the stapled .app, so the copy inside carries its ticket.
      - name: Build the .dmg
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/dmgroot"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Scanpath Studio" -srcfolder "$STAGE" \
            -ov -format UDZO "${{ matrix.archive }}"

      # The .app inside carries its own ticket and would open regardless, but a
      # downloaded disk image is itself quarantined, and Apple advises against
      # shipping the container unsigned.
      - name: Sign, notarize and staple the .dmg
        if: runner.os == 'macOS' && steps.signing.outputs.enabled == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          codesign --force --timestamp \
            --sign "${{ secrets.APPLE_SIGNING_IDENTITY }}" "${{ matrix.archive }}"
          ./.github/scripts/notarize.sh "${{ matrix.archive }}"
          xcrun stapler staple "${{ matrix.archive }}"
          xcrun stapler validate "${{ matrix.archive }}"

      # Stapling rewrites the bundle, so prove it still boots and still passes
      # Gatekeeper afterwards — this run additionally asserts the ticket.
      - name: Re-verify the stapled bundle
        if: runner.os == 'macOS' && steps.signing.outputs.enabled == 'true'
        env:
          SCANPATH_EXPECT_NOTARIZED: "1"
        run: python desktop/smoke_test.py

      - name: Archive (tar.gz, keeps the executable bit)
        if: runner.os == 'Linux'
        run: tar -C dist -czf ${{ matrix.archive }} ScanpathStudio

      - name: Archive (zip)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/ScanpathStudio -DestinationPath ${{ matrix.archive }}
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

      - name: Clean up the signing keychain and API key
        if: ${{ always() && runner.os == 'macOS' }}
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/devid.p12"

  # Single fan-in job so the three matrix legs don't race each other (or
  # publish.yml) creating the release. publish.yml owns the release notes and
  # overwrites (`gh release edit`) whatever exists once it succeeds.
  release:
    name: Attach archives to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release if missing and upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # Tolerate exactly one failure mode of `create`: losing the race to
        # publish.yml (re-check with `view`). Anything else — permissions, a
        # bad tag — still fails the job loudly. Uploads retry per file:
        # uploads.github.com intermittently 404s mid-batch (it dropped the
        # macOS asset on the v0.25.0 release), and --clobber makes retries
        # idempotent.
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" \
              --notes "Release $TAG (notes added by the PyPI publish workflow)." \
              || gh release view "$TAG" >/dev/null
          fi
          # The .dmg glob is load-bearing: the macOS asset stopped being a
          # tarball in ENG-21, and a missing pattern here drops it from the
          # release silently — `if-no-files-found` guards the artifact upload,
          # not this loop.
          shopt -s nullglob
          assets=(ScanpathStudio-*.tar.gz ScanpathStudio-*.zip ScanpathStudio-*.dmg)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::no ScanpathStudio-* archives were downloaded"
            exit 1
          fi
          for f in "${assets[@]}"; do
            ok=""
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$f" --clobber; then ok=1; break; fi
              echo "upload of $f failed (attempt $attempt/3); retrying in 15s"
              sleep 15
            done
            [ -n "$ok" ] || { echo "::error::upload of $f failed after 3 attempts"; exit 1; }
          done
