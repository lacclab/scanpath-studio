name: Docs

# GitHub Pages serves gh-pages from its root. Release docs own that root
# and main owns dev/. Serialize both writers, including manual rebuilds.
on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      channel:
        description: "Docs edition to rebuild"
        type: choice
        options: [stable, dev]
        default: stable

concurrency:
  group: docs-deploy
  queue: max

permissions:
  contents: write
  pages: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      SCANPATH_DOCS_CHANNEL: ${{ inputs.channel || (github.ref_type == 'tag' && 'stable') || 'dev' }}
      # Link-preview cards (the Material social plugin) — rendered for
      # the published site only.
      SOCIAL_CARDS: "true"
      # Material and a plugin both print a banner about MkDocs 2.0; the site
      # stays on MkDocs 1.x (Material caps it), so the notice is noise here.
      DISABLE_MKDOCS_2_WARNING: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select the source for this edition
        run: |
          if [ "$SCANPATH_DOCS_CHANNEL" = stable ]; then
            ref="$(git tag --list --sort=-v:refname | awk '/^v[0-9]+[.][0-9]+[.][0-9]+$/ && !found {print; found=1}')"
          else
            ref=origin/main
          fi
          git checkout --detach "$ref"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Cairo (social cards)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2
      - name: Install (package + docs + test extras)
        # The test extras are here for the coverage report published alongside
        # the site — see "Coverage report" below.
        run: pip install -e ".[docs,test]"
      - name: Build (strict — fail on warnings / bad refs)
        id: build
        run: mkdocs build --strict

      # The coverage badge, with no third-party account and no
      # commit-back. The site is already published from this workflow, so the
      # HTML report is written into the built `site/` and shipped with it, plus a
      # tiny shields.io *endpoint* JSON the README badge reads. That makes the
      # badge a link to the browsable report rather than a bare number.
      # The deploy below publishes `site/` as built, so these extra files ship
      # with it.
      #
      # The report is a by-product of this job, not its gate: one flaky AppTest
      # or a coverage dip must not stop the docs from publishing. The PR's CI
      # already gates on both; here the floor is off and a failing run still
      # ships the site (with whatever report it produced).
      - name: Coverage report
        if: env.SCANPATH_DOCS_CHANNEL == 'stable'
        continue-on-error: true
        run: pytest -q -n auto --cov --cov-fail-under=0 --cov-report=html:site/coverage --cov-report=json
      - name: Coverage badge
        if: ${{ !cancelled() && env.SCANPATH_DOCS_CHANNEL == 'stable' && steps.build.outcome == 'success' }}
        run: |
          python - <<'PY'
          import json, pathlib
          report = pathlib.Path("coverage.json")
          if not report.is_file():
              raise SystemExit(0)  # no report this run: keep the last badge
          total = json.load(report.open())["totals"]["percent_covered"]
          colour = (
              "brightgreen" if total >= 90
              else "green" if total >= 80
              else "yellow" if total >= 70
              else "orange" if total >= 60
              else "red"
          )
          pathlib.Path("site/coverage/badge.json").write_text(
              json.dumps(
                  {
                      "schemaVersion": 1,
                      "label": "coverage",
                      "message": f"{total:.0f}%",
                      "color": colour,
                  }
              )
          )
          PY

      - name: Deploy this edition to GitHub Pages
        id: publish
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          pages="$RUNNER_TEMP/published"
          git worktree add --detach "$pages" origin/gh-pages
          if [ "$SCANPATH_DOCS_CHANNEL" = dev ]; then
            mkdir -p "$pages/dev"
            rsync -a --checksum --delete site/ "$pages/dev/"
          else
            rsync -a --checksum --delete --exclude=/.git --exclude=/dev/ --exclude=/CNAME site/ "$pages/"
          fi
          touch "$pages/.nojekyll"
          git -C "$pages" add -A
          if ! git -C "$pages" diff --cached --quiet; then
            git -C "$pages" -c user.name=github-actions[bot] -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Publish $SCANPATH_DOCS_CHANNEL docs from $(git rev-parse --short HEAD)"
            git push origin "$(git -C "$pages" rev-parse HEAD):refs/heads/gh-pages"
          fi

      - name: Build Pages from the published branch
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
