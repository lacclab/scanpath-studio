[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
# pandas announces its next major's breaking changes as Pandas4Warning one
# release early; failing on them is how a deprecation turns red here before a
# pandas release turns main red. Later lines win: the .xls reader still uses
# xlrd, whose replacement (calamine) parses cells differently and is its own
# change.
filterwarnings =
    error::pandas.errors.Pandas4Warning
    ignore:The xlrd engine is deprecated:pandas.errors.Pandas4Warning
